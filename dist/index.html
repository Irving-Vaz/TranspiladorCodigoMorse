<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Morse</title>
</head>
<body class="bg-dark text-light">

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1>Traductor Morse</h1>
            <p class="text-secondary">Traducir codigo morse y vice</p>
        </div>

        <div class="card bg-secondary text-light shadow p-4">

            <div class="mb-4">
                <label class="form-label">Tipo de conversión</label>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-info w-50" id="textoMorse">
                        Texto a Morse
                    </button>

                    <button type="button" class="btn btn-outline-light w-50" id="morseTexto">
                        Morse a Texto
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="entrada" class="form-label" id="etiquetaEntrada">
                    Ingresa el texto
                </label>

                <textarea class="form-control" id="entrada" rows="5"
                    placeholder="Escribe aquí el texto que deseas convertir..."></textarea>
            </div>

            <div class="d-flex gap-2 mb-4">
                <button type="button" class="btn btn-info flex-fill" id="convertir">
                    Convertir
                </button>

                <button type="button" class="btn btn-danger flex-fill" id="barredora">
                    Limpiar
                </button>
            </div>

            <div class="mb-2">
                <label for="resultado" class="form-label">Resultado</label>

                <textarea class="form-control" id="resultado" rows="5"
                    placeholder="Aquí aparecerá el resultado..." readonly></textarea>
            </div>

        </div>

        <div class="text-center mt-4 text-secondary">
            <p>Traductor de texto y código Morse</p>
        </div>

    </div>

</body>
</html>
