<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/CSS/style.css">
    <title>Traductor Morse</title>
</head>
<body>

    <div class="main-wrapper">

        <div class="header-content">
            <h1>Traductor Morse</h1>
            <p>Traduce código morse y viceversa</p>
        </div>

        <div class="card-box">

            <div class="form-group">
                <label class="custom-label">Selecciona la conversión</label>
                <div class="button-row">
                    <button type="button" class="custom-btn btn-primary-custom" id="textoMorse">
                        Texto a Morse
                    </button>
                    <button type="button" class="custom-btn btn-outline-custom" id="morseTexto">
                        Morse a Texto
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="entrada" class="custom-label" id="etiquetaEntrada">
                    Ingresa el texto
                </label>
                <textarea class="custom-textarea" id="entrada" rows="4"
                    placeholder="Escribe aquí el texto que deseas convertir..."></textarea>
            </div>

            <div class="button-row action-row">
                <button type="button" class="custom-btn btn-primary-custom" id="convertir">
                    Convertir
                </button>
                <button type="button" class="custom-btn btn-danger-custom" id="barredora">
                    Limpiar
                </button>
            </div>

            <div class="form-group">
                <label for="resultado" class="custom-label">Resultado</label>
                <textarea class="custom-textarea" id="resultado" rows="4"
                    placeholder="Aquí aparecerá el resultado..." readonly></textarea>
            </div>

        </div>

        <div class="footer-content">
            <p>Traductor de texto y código Morse</p>
        </div>

    </div>

    <script src="./bundle.js"></script>
</body>
</html>
